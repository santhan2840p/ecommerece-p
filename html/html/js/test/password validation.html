<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <input id="pwd" type="password" placeholder="Enter password" name="password"><br>
    <p id="pwdp"></p>
   <input id="login" type="button" value="login">
   <p id="text"></p>
</form>
   <script>
     document.getElementById('login').addEventListener('click',()=>{
           
            let password=document.getElementById('pwd').value;
            let passwordpattern=/^[A-Z][a-z0-9_!@#$%^&()]\d{11,}$/;
            if(passwordpattern.test(password)){
                document.getElementById('pwdp').innerHTML ='valid password';
            }else{
                document.getElementById('pwdp').innerHTML ='invalid password';
            }
            let i=passwordpattern;
            if(i=>5)
            {
                let text=document.getElementById('text').innerHTML ='weakpassword';
            }
            else{
                let text=document.getElementById('text').innerHTML ='strongpassword';

            }
        });
   </script>
</body>
</html>
